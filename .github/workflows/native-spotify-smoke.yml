name: Native Spotify smoke checks

on:
  push:
    branches: [master]
    paths:
      - "custom_components/aureon_music/native_*.py"
      - "scripts/check_native_core.py"
      - ".github/workflows/native-spotify-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Native Python smoke checks (no HA, no credentials)
        run: python scripts/check_native_core.py
